openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /showcase:
    get:
      operationId: getShowcase
      summary: Read-only public prize preview; never creates users or consumes prizes
      responses:
        "200":
          description: Current catalog from the existing MongoDB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Showcase"
        "503":
          description: Database is unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    ShowcasePrize:
      type: object
      required: [key, name, icon, imageUrl, stock, active, probability]
      properties:
        key: { type: string }
        name: { type: string }
        icon: { type: string }
        imageUrl: { type: ["string", "null"] }
        stock: { type: integer, description: "-1 means unlimited; 0 is visible but ineligible." }
        active: { type: boolean }
        probability: { type: number, description: "Configured weight, not an availability-adjusted percentage." }
    Showcase:
      type: object
      required: [ok, prizes, botUsername, configured, spinCooldownHours]
      properties:
        ok: { type: boolean }
        prizes:
          type: array
          items: { $ref: "#/components/schemas/ShowcasePrize" }
        botUsername: { type: string }
        configured: { type: boolean }
        spinCooldownHours: { type: number }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

