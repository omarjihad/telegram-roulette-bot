# MF Battle online game server on Cloudflare (Workers + Durable Objects).
# The room runs inside one Durable Object placed close to the players (LOCATION_HINT),
# with the same rules and room code as the bot's own server (artifacts/mf-battle).
name = "mf-battle-game"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "BattleRoomDO"

# Free plan: SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["BattleRoomDO"]

[vars]
# The bot's server on Railway (players sign in and get coins there).
API_BASE = "https://telegram-roulette-bot-production-d10e.up.railway.app"
# Where to start the room: me = Middle East, eeur = Eastern Europe, weur = Western Europe.
LOCATION_HINT = "me"

# Secret (set it in the Cloudflare dashboard, never here): BATTLE_INTERNAL_KEY —
# the same value as BATTLE_INTERNAL_KEY on Railway.
